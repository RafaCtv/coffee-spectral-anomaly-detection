# Parametros do pipeline. Lido pelo Python (gee/) e pelo R (R/).
# Manter o formato plano: "chave: valor", sem aninhamento e sem listas.

# --- Area ---
area_geojson: area/fazenda_car.geojson
area_nome: MG-3108008-8D60BF7D

# --- Periodo de extracao (data_fim aceita "hoje") ---
data_inicio: 2019-01-01
data_fim: hoje

# --- Sentinel-2 e mascara de nuvem ---
colecao: COPERNICUS/S2_SR_HARMONIZED
colecao_nuvem: GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED
banda_qa: cs_cdf
limiar_nuvem: 0.6
banda_vermelho: B4
banda_nir: B8
escala: 10

# --- Observacoes concorrentes no mesmo dia: media ou primeira ---
agregacao_dia: primeira

# --- BFAST Monitor ---
bfast_formula: harmon
bfast_order: 1
bfast_level: 0.05
min_obs_historico: 30
min_meses_historico: 14

# --- Modo: operacao (dados novos) ou replay (simula sobre o passado) ---
modo: operacao

monitor_inicio: 2026-01-01

replay_monitor_inicio: 2021-01-01
replay_evento_ref: 2021-07-01
